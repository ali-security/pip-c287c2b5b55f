name: CI

on:
  workflow_dispatch:
    # allow manual runs on branches without a PR

env:
  # The "FORCE_COLOR" variable, when set to 1,
  # tells Nox to colorize itself.
  FORCE_COLOR: "1"
  # Keep pytest's own output uncoloured so the "N passed" summary lines are
  # plain text in the job logs. pyproject.toml's addopts forces --color=yes
  # (and ships in the sdist, so it stays untouched); PYTEST_ADDOPTS is
  # applied after the ini addopts, so this overrides it.
  PYTEST_ADDOPTS: "--color=no"
  # The runner's current git starts detached auto-maintenance after
  # `git commit`, which transiently creates .git/objects/maintenance.lock
  # while scripttest snapshots the scratch tree (FileNotFoundError in
  # tests/functional/test_vcs_git.py). Env-level config survives the test
  # suite's HOME/system-config isolation.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - run: pip install nox
      - run: nox -s docs

  determine-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            vendoring:
              # Anything that's touching "vendored code"
              - "src/pip/_vendor/**"
              - "pyproject.toml"
              - "noxfile.py"
            tests:
              # Anything that's touching code-related stuff
              - ".github/workflows/ci.yml"
              - "src/**"
              - "tests/**"
              - "noxfile.py"
              # The test suite should also run when cutting a release
              # (which is the only time this file is modified).
              - "NEWS.rst"
        if: github.event_name == 'pull_request'

  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Set up git credentials
        run: |
          git config --global user.email "pypa-dev@googlegroups.com"
          git config --global user.name "pip"

      - run: pip install nox
      - run: nox -s prepare-release -- 99.9
      - run: nox -s build-release -- 99.9
      - run: pipx run check-sdist

  vendoring:
    name: vendoring
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.vendoring == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - run: pip install nox
      - run: nox -s vendoring
      - run: git diff --exit-code

  tests-unix:
    name: tests / ${{ matrix.python.version || matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          # Pinned to the prerelease that existed when 26.1.1 was released;
          # a bare "3.15" resolves to a newer prerelease whose changed
          # user-site semantics break the functional suite.
          - { key: "3.15", version: "3.15.0-alpha.8" }
          - "3.14t"
        include:
          # Oldest patch release per minor version on ubuntu-latest,
          # to catch backport/bug fix regressions. Constrained by what
          # actions/setup-python ships for the runner OS (ubuntu-24.04).
          # See: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          - os: ubuntu-latest
            python: { key: "3.10", version: "3.10.4" }
          - os: ubuntu-latest
            python: { key: "3.11", version: "3.11.0" }
          - os: ubuntu-latest
            python: { key: "3.12", version: "3.12.0" }
          - os: ubuntu-latest
            python: { key: "3.13", version: "3.13.0" }
          - os: ubuntu-latest
            python: { key: "3.14", version: "3.14.0" }

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python.version || matrix.python }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install brz subversion

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          DEPS=breezy
          if ! which svn; then
            DEPS="${DEPS} subversion"
          fi
          brew install ${DEPS}

      - run: pip install nox

      # Python 3.15 is pinned to a release-era alpha; test dependencies
      # published later (markupsafe cp315 wheels, cryptography abi3t wheels)
      # are built against a newer 3.15 ABI that the alpha cannot load.
      # Pre-provision the nox env from the registry as of the 26.1.1 release
      # date, and reuse that env below so PIP_INDEX_URL never reaches the
      # test runs.
      - name: Pre-install test environment (3.15 alpha)
        if: matrix.python.key == '3.15'
        env:
          PIP_INDEX_URL: https://:2026-05-04T19:02:18.900185Z@time-machines-pypi.sealsecurity.io/
        run: nox -s test-3.15 --install-only

      # Main check
      - name: Run unit tests
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} ${{ matrix.python.key == '3.15' && '--no-install' || '' }} --
          tests/unit
          --verbose --numprocesses auto --showlocals
      - name: Run integration tests
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --no-install --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15

  tests-windows:
    name: tests / ${{ matrix.python.key || matrix.python }} / ${{ matrix.os }} / ${{ matrix.group.number }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 50

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [Windows]
        python:
          - "3.10"
          # Commented out, since Windows tests are expensively slow,
          # only test the oldest and newest Python supported by pip
          # - "3.11"
          # - "3.12"
          # - "3.13"
          - "3.14"
          # Pinned to the prerelease that existed when 26.1.1 was released;
          # a bare "3.15" resolves to a newer prerelease whose changed
          # user-site semantics break the functional suite.
          - { key: "3.15", version: "3.15.0-alpha.8" }
          - "3.14t"
        group:
          - { number: 1, pytest-filter: "not test_install" }
          - { number: 2, pytest-filter: "test_install" }

    steps:
      # The D: drive is significantly faster than the system C: drive.
      # https://github.com/actions/runner-images/issues/8755
      - name: Set TEMP to D:/Temp
        run: |
          mkdir "D:\\Temp"
          echo "TEMP=D:\\Temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python.version || matrix.python }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Subversion
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            winget install --accept-source-agreements --accept-package-agreements -e --id Slik.Subversion
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $i)
          }
          echo "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: pip install nox

      # Python 3.15 is pinned to a release-era alpha; test dependencies
      # published later (markupsafe cp315 wheels, cryptography abi3t wheels)
      # are built against a newer 3.15 ABI that the alpha cannot load.
      # Pre-provision the nox env from the registry as of the 26.1.1 release
      # date, and reuse that env below so PIP_INDEX_URL never reaches the
      # test runs.
      - name: Pre-install test environment (3.15 alpha)
        if: matrix.python.key == '3.15'
        env:
          PIP_INDEX_URL: https://:2026-05-04T19:02:18.900185Z@time-machines-pypi.sealsecurity.io/
        run: nox -s test-3.15 --install-only

      # Main check
      - name: Run unit tests (group 1)
        if: matrix.group.number == 1
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} ${{ matrix.python.key == '3.15' && '--no-install' || '' }} --
          tests/unit
          --verbose --numprocesses auto --showlocals

      - name: Run integration tests (group ${{ matrix.group.number }})
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --no-install --
          tests/functional -k "${{ matrix.group.pytest-filter }}"
          --verbose --numprocesses auto --showlocals --durations=15

  tests-zipapp:
    name: tests / zipapp
    # The macos-latest (M1) runners are the fastest available on GHA, even
    # beating out the ubuntu-latest runners. The zipapp tests are slow by
    # nature, and we don't care where they run, so we pick the fastest one.
    runs-on: macos-latest
    timeout-minutes: 30

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10"

      - name: Install MacOS dependencies
        run: brew install breezy subversion

      - run: pip install nox

      # Main check
      - name: Run integration tests
        run: >-
          nox -s test-3.10 --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15
          --use-zipapp

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - determine-changes
      - docs
      - packaging
      - tests-unix
      - tests-windows
      - tests-zipapp
      - vendoring

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: >-
            ${{
              (
                needs.determine-changes.outputs.vendoring != 'true'
                && github.event_name == 'pull_request'
              )
              && 'vendoring'
              || ''
            }}
            ,
            ${{
              (
                needs.determine-changes.outputs.tests != 'true'
                && github.event_name == 'pull_request'
              )
              && '
                tests-unix,
                tests-windows,
                tests-zipapp,
                tests-importlib-metadata,
              '
              || ''
            }}
          jobs: ${{ toJSON(needs) }}
