name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          persist-credentials: false
      - name: Pin the commit date so SOURCE_DATE_EPOCH matches the upstream release
        run: |
          git config user.email "info@seal.security"
          git config user.name "Seal Security"
          GIT_COMMITTER_DATE="@1777920967 +0200" git commit --amend --no-edit --date="@1777920967 +0200"
      - name: Build a binary wheel and a source tarball
        run: ./build-project/build-project.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
